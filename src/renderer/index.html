<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws:"
    />
    <title>芝刈りシミュレーター</title>
  </head>
  <body>
    <div id="app"><canvas id="view"></canvas></div>
    <svg id="sun-gizmo" aria-hidden="true"></svg>
    <div id="sun-gizmo-label" aria-hidden="true"></div>

    <div id="top-left">
      <section id="status-panel">
        <dl id="status-readout" class="readout"></dl>
      </section>
      <div id="fps-counter"></div>
    </div>

    <div id="top-right">
      <button id="toggle-auto" type="button" aria-pressed="false" aria-label="自動運転(仮)" title="自動運転(仮)(P)"><svg id="auto-off-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4.5v15l12-7.5Z" /></svg><svg id="auto-on-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.5" /></svg></button>
      <button id="reset" type="button" aria-label="やり直し" title="やり直し(R)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" /></svg></button>
      <button id="open-settings" type="button" aria-label="設定 (,)" title="設定 (,)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.61 4.83L10.83 2.47L13.17 2.47L13.39 4.83L16.08 5.95L17.91 4.44L19.56 6.09L18.05 7.92L19.17 10.61L21.53 10.83L21.53 13.17L19.17 13.39L18.05 16.08L19.56 17.91L17.91 19.56L16.08 18.05L13.39 19.17L13.17 21.53L10.83 21.53L10.61 19.17L7.92 18.05L6.09 19.56L4.44 17.91L5.95 16.08L4.83 13.39L2.47 13.17L2.47 10.83L4.83 10.61L5.95 7.92L4.44 6.09L6.09 4.44L7.92 5.95Z" /><circle cx="12" cy="12" r="3.1" /></svg></button>
      <button id="open-help" type="button" aria-label="操作の一覧 (?)" title="操作の一覧 (?)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5" /><path d="M9.2 9.3a2.9 2.9 0 0 1 5.6 1c0 1.9-2.8 2.6-2.8 4.2" /><circle cx="12" cy="17.6" r="0.4" fill="currentColor" /></svg></button>
    </div>

    <div id="top-center">
      <div id="view-hint">W / S で前進と後退、A / D で操舵、Space で刈刃の上げ下げ、C で視点切り替え、? で操作の一覧</div>
    </div>

    <div id="right-stack">
      <section class="side-panel">
        <details class="panel-fold">
          <summary>マップ</summary>
          <div id="map-switch" class="switch" role="group" aria-label="マップ"></div>
          <p id="map-description" class="panel-note"></p>
        </details>
      </section>
      <section class="side-panel">
        <details class="panel-fold" open>
          <summary>カメラ</summary>
          <dl id="camera-readout" class="readout"></dl>
          <div id="camera-fields" class="field-list"></div>
        </details>
      </section>
      <section class="side-panel">
        <details class="panel-fold">
          <summary>時間</summary>
          <div id="time-fields" class="field-list"></div>
        </details>
      </section>
      <section class="side-panel">
        <details class="panel-fold">
          <summary>光と風</summary>
          <div id="light-fields" class="field-list"></div>
        </details>
      </section>
      <section class="side-panel">
        <details class="panel-fold">
          <summary>芝</summary>
          <div id="grass-fields" class="field-list"></div>
        </details>
      </section>
      <section class="side-panel">
        <details id="zone-panel" class="panel-fold">
          <summary>区分け</summary>
          <dl id="zone-readout" class="readout"></dl>
          <div id="zone-fields" class="field-list"></div>
        </details>
      </section>
      <section class="side-panel">
        <details id="route-panel" class="panel-fold">
          <summary>区画と経路</summary>
          <dl id="route-readout" class="readout"></dl>
          <div id="route-fields" class="field-list"></div>
        </details>
      </section>
    </div>

    <div id="bottom-right">
      <div id="speed-switch" class="switch" role="group" aria-label="倍速"></div>
      <div id="view-switch" class="switch" role="group" aria-label="視点"></div>
    </div>

    <dialog id="settings" aria-labelledby="settings-title">
      <div class="dialog-head">
        <h2 id="settings-title">設定</h2>
        <button id="close-settings" type="button">閉じる</button>
      </div>
      <div id="settings-tabs" role="tablist"></div>
      <div id="settings-body"></div>
      <div class="dialog-foot">
        <button id="settings-reset-all" type="button">すべて既定に戻す</button>
      </div>
    </dialog>
    <dialog id="key-help" aria-labelledby="key-help-title">
      <div class="dialog-head">
        <h2 id="key-help-title">操作の一覧</h2>
        <button id="close-help" type="button">閉じる</button>
      </div>
      <div id="key-help-body"></div>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
